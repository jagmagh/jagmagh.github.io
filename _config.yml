# Site settings
title: Jagmag H K
email: jagmagh@gmail.com
url: https://www.jagmagh.com
description: "Software Architect and Enterprise Architect with 24+ years of experience building and modernizing enterprise technology platforms across SE Asia."
keywords: "Jagmag, Enterprise Architecture, Solution Architecture, Digital Transformation, AWS, Azure, TOGAF, Cloud, Singapore"
skills: "Enterprise Architecture · Digital Transformation · AI-Augmented Architecture"
meta_author: Jagmag

# Google webmaster tools
google_verify:

# https://ssl.bing.com/webmaster/configure/verify/ownership Option 2 content= goes here
bing_verify:

# Contact form:
# - static : pass through formspree.io to validate email sending
# - disqus : replace contact form by disqus thread
# - comment the line below if you want to stick with the default PHP contact form
contact: static

# If you use disqus you need disqus shortname
# https://help.disqus.com/customer/portal/articles/466208
disqus_shortname: myshortname

# Color settings (hex-codes without the leading hash-tag)
color:
  primary: 2E86AB
  primary-rgb: "46,134,171"
  secondary: 2c3e50
  secondary-dark: 233140

# Footer settings
footer:
  copyright: Jagmag
  location: Locations Worked
  social: Social
  credits: Credits

# Social networks usernames (many more available: google-plus, flickr, dribbble, pinterest, instagram, tumblr, linkedin, etc.)
social:
  - title: stack-overflow
    url: https://stackoverflow.com/users/372871/jagmag
  - title: linkedin
    url: https://www.linkedin.com/in/jagmagh/

# Postal address (add as many lines as necessary)
address:
  - line: Singapore, Thailand, Indonesia, America, India

# Credits content
credits: ""

# Collections
collections:
  portfolio:
    output: false

# Build settings
markdown: kramdown
permalink: pretty
future: true
plugins:
  - jekyll-sitemap
exclude:
  - STATE.md
  - DECISIONS.md
  - OPEN-QUESTIONS.md
  - Gemfile
  - Gemfile.lock
  - freelancer-theme-jekyll.gemspec
  - inputs/
  - work/
  - outputs/
