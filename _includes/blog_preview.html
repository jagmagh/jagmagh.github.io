{% if site.posts.size > 0 %}
<!-- Blog Preview Section -->
<section id="blog">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2>From the Blog</h2>
                <hr class="star-primary">
            </div>
        </div>
        <div class="row">
            {% for post in site.posts limit:5 %}
            <div class="col-lg-10 col-lg-offset-1" style="margin-bottom: 30px;">
                <h4><a href="{{ post.url }}">{{ post.title }}</a></h4>
                <p class="text-muted"><small>{{ post.date | date: "%B %-d, %Y" }}</small></p>
                <p>{{ post.excerpt | strip_html | truncatewords: 50 }}</p>
                <a href="{{ post.url }}" class="btn btn-primary btn-sm">Read more &rarr;</a>
            </div>
            {% endfor %}
        </div>
        <div class="row" style="margin-top: 10px;">
            <div class="col-lg-12 text-center">
                <a href="/blog" class="btn btn-default">View all posts</a>
            </div>
        </div>
    </div>
</section>
{% endif %}
